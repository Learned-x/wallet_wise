<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fotocamera OCR</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Salta al contenuto</a>
  <div class="app">
    <header class="topbar">
      <button class="icon-btn" aria-label="Indietro" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button>
      <div class="title">Scanner Ricevute</div>
      <button class="icon-btn" aria-label="Impostazioni"><i class="fa-solid fa-gear"></i></button>
    </header>

  <main id="main" class="container">
    <div class="viewfinder reveal" role="img" aria-label="Inquadra la ricevuta all'interno del riquadro guida">
        <div>
          <div class="badge"><i class="fa-solid fa-receipt" aria-hidden="true"></i> RICEVUTA SCANNER</div>
      <p class="small center mt-8">Inquadra la ricevuta • Tieni fermo il telefono</p>
        </div>
      </div>

    <div class="controls-row reveal" aria-label="Controlli fotocamera">
        <button class="btn btn-ghost" aria-label="Apri galleria"><i class="fa-regular fa-image"></i><br><span class="small">Galleria</span></button>
        <button class="capture-btn" aria-label="Scatta foto"></button>
        <button class="btn btn-ghost" aria-label="Attiva/disattiva flash"><i class="fa-solid fa-bolt"></i><br><span class="small">Flash</span></button>
      </div>

    <p class="small center mt-12">Tieni premuto per video scanning</p>
      <div class="bottom-space"></div>
    </main>

    <nav class="bottom-nav" role="navigation" aria-label="Navigazione inferiore">
      <a href="dashboard.html" aria-label="Home"><i class="fa-solid fa-house"></i><span class="visually-hidden">Home</span></a>
      <a href="report.html" aria-label="Report"><i class="fa-solid fa-chart-pie"></i><span class="visually-hidden">Report</span></a>
      <a href="camera-ocr.html" aria-current="page" aria-label="Fotocamera"><i class="fa-solid fa-camera"></i><span class="visually-hidden">Fotocamera</span></a>
      <a href="health-score.html" aria-label="Health Score"><i class="fa-solid fa-gauge-high"></i><span class="visually-hidden">Health Score</span></a>
      <a href="settings.html" aria-label="Impostazioni"><i class="fa-solid fa-gear"></i><span class="visually-hidden">Impostazioni</span></a>
    </nav>
  </div>
</body>
</html>
