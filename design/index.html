<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wallet Wise - Welcome</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Salta al contenuto</a>
  <div class="app">
    <header class="topbar" role="banner" aria-label="Intestazione app">
      <button class="icon-btn" aria-label="Menu" onclick="location.href='settings.html'"><i class="fa-solid fa-bars"></i></button>
      <div class="title">Wallet Wise</div>
      <div class="header-actions">
        <button class="icon-btn" aria-label="Impostazioni" onclick="location.href='settings.html'"><i class="fa-solid fa-gear"></i></button>
      </div>
    </header>

    <main id="main">
  <section class="hero reveal" aria-labelledby="welcome-title">
        <div class="logo" aria-hidden="true"><i class="fa-solid fa-wallet" aria-hidden="true"></i></div>
        <h1 id="welcome-title">Prendi il controllo delle tue finanze con l'AI</h1>
        <p>Design semplice, moderno e accessibile. I tuoi dati restano sul tuo telefono.</p>
  <div class="illustration skeleton" role="img" aria-label="Persona che guarda un telefono con grafici positivi">
          Illustrazione
        </div>
        <div class="container">
          <button class="btn btn-primary btn-block" onclick="location.href='onboarding-features.html'"><i class="fa-solid fa-bolt"></i> Inizia Subito</button>
          <p class="center small mt-12">Nessun account richiesto • Dati solo sul dispositivo</p>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
