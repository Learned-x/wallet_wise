<svg width="375" height="812" viewBox="0 0 375 812" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Add Transaction">
  <rect width="375" height="812" fill="#F7F9F8"/>
  <!-- Topbar -->
  <rect x="0" y="0" width="375" height="56" fill="#FFFFFF" stroke="#E0E6E2"/>
  <rect x="12" y="12" width="32" height="32" rx="8" fill="#EEF5F1"/>
  <rect x="331" y="12" width="32" height="32" rx="8" fill="#EEF5F1"/>
  <rect x="102" y="17" width="171" height="22" rx="6" fill="#DDE6E1"/>
  <text x="28" y="29" font-size="18" fill="#1F2A1F" text-anchor="middle" dominant-baseline="middle">←</text>
  <text x="347" y="28" font-size="16" fill="#1F2A1F" text-anchor="middle" dominant-baseline="middle">✓</text>
  <text x="188" y="30" font-size="16" fill="#1F2A1F" text-anchor="middle">Nuova transazione</text>

  <!-- Fields -->
  <rect x="24" y="76" width="80" height="18" rx="9" fill="#CBD7D0"/>
  <text x="34" y="90" font-size="12" fill="#1F2A1F">Importo</text>
  <rect x="24" y="100" width="327" height="48" rx="12" fill="#FFFFFF" stroke="#E0E6E2"/>

  <rect x="24" y="166" width="90" height="18" rx="9" fill="#CBD7D0"/>
  <text x="34" y="180" font-size="12" fill="#1F2A1F">Categoria</text>
  <!-- Category grid: 3 columns x 4 rows -->
  <g>
    <rect x="24" y="190" width="101" height="48" rx="12" fill="#FFFFFF" stroke="#E0E6E2"/>
    <rect x="135" y="190" width="101" height="48" rx="12" fill="#FFFFFF" stroke="#E0E6E2"/>
    <rect x="246" y="190" width="101" height="48" rx="12" fill="#FFFFFF" stroke="#E0E6E2"/>
    <rect x="24" y="244" width="101" height="48" rx="12" fill="#FFFFFF" stroke="#E0E6E2"/>
    <rect x="135" y="244" width="101" height="48" rx="12" fill="#FFFFFF" stroke="#E0E6E2"/>
    <rect x="246" y="244" width="101" height="48" rx="12" fill="#FFFFFF" stroke="#E0E6E2"/>
    <rect x="24" y="298" width="101" height="48" rx="12" fill="#FFFFFF" stroke="#E0E6E2"/>
    <rect x="135" y="298" width="101" height="48" rx="12" fill="#FFFFFF" stroke="#E0E6E2"/>
    <rect x="246" y="298" width="101" height="48" rx="12" fill="#FFFFFF" stroke="#E0E6E2"/>
    <rect x="24" y="352" width="101" height="48" rx="12" fill="#FFFFFF" stroke="#E0E6E2"/>
    <rect x="135" y="352" width="101" height="48" rx="12" fill="#FFFFFF" stroke="#E0E6E2"/>
    <rect x="246" y="352" width="101" height="48" rx="12" fill="#FFFFFF" stroke="#E0E6E2"/>
  </g>

  <rect x="24" y="416" width="90" height="18" rx="9" fill="#CBD7D0"/>
  <text x="34" y="430" font-size="12" fill="#1F2A1F">Descrizione</text>
  <rect x="24" y="440" width="327" height="48" rx="12" fill="#FFFFFF" stroke="#E0E6E2"/>

  <rect x="24" y="506" width="60" height="18" rx="9" fill="#CBD7D0"/>
  <text x="34" y="520" font-size="12" fill="#1F2A1F">Data</text>
  <rect x="24" y="530" width="327" height="48" rx="12" fill="#FFFFFF" stroke="#E0E6E2"/>

  <rect x="24" y="596" width="75" height="18" rx="9" fill="#CBD7D0"/>
  <text x="34" y="610" font-size="12" fill="#1F2A1F">Tipo</text>
  <rect x="24" y="620" width="154" height="48" rx="12" fill="#FFFFFF" stroke="#2E7D5B"/>
  <rect x="197" y="620" width="154" height="48" rx="12" fill="#FFFFFF" stroke="#2E7D5B"/>

  <!-- Save Button -->
  <rect x="24" y="692" width="327" height="48" rx="12" fill="#2E7D5B"/>
  <text x="188" y="722" font-size="16" fill="#FFFFFF" text-anchor="middle">Salva</text>

  <!-- Bottom Nav -->
  <rect x="0" y="748" width="375" height="64" fill="#FFFFFF" stroke="#E0E6E2"/>
</svg>
